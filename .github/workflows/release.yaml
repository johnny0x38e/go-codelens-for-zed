name: Release

on:
    push:
        tags:
            - "v*"

permissions:
    contents: read

concurrency:
    group: release-${{ github.ref }}
    cancel-in-progress: false

jobs:
    metadata:
        name: Validate release metadata
        runs-on: ubuntu-24.04
        outputs:
            version: ${{ steps.version.outputs.version }}
        steps:
            - uses: actions/checkout@v4

            - id: version
              name: Validate tag and package versions
              shell: bash
              run: |
                  tag_version=${GITHUB_REF_NAME#v}
                  test -n "$tag_version"
                  ./scripts/set-version.sh --check "$tag_version"
                  echo "version=$tag_version" >> "$GITHUB_OUTPUT"

    build:
        name: Build (${{ matrix.target }})
        needs: metadata
        strategy:
            fail-fast: false
            matrix:
                include:
                    - runner: macos-15
                      goos: darwin
                      goarch: arm64
                      target: aarch64-apple-darwin
                      suffix: ""
                    - runner: macos-15-intel
                      goos: darwin
                      goarch: amd64
                      target: x86_64-apple-darwin
                      suffix: ""
                    - runner: ubuntu-24.04-arm
                      goos: linux
                      goarch: arm64
                      target: aarch64-unknown-linux-gnu
                      suffix: ""
                    - runner: ubuntu-24.04
                      goos: linux
                      goarch: amd64
                      target: x86_64-unknown-linux-gnu
                      suffix: ""
                    - runner: windows-11-arm
                      goos: windows
                      goarch: arm64
                      target: aarch64-pc-windows-msvc
                      suffix: .exe
                    - runner: windows-2025
                      goos: windows
                      goarch: amd64
                      target: x86_64-pc-windows-msvc
                      suffix: .exe
        runs-on: ${{ matrix.runner }}
        defaults:
            run:
                shell: bash
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-go@v6
              with:
                  go-version-file: server/go.mod
                  cache-dependency-path: server/go.sum

            - name: Verify native runner
              run: |
                  test "$(go env GOOS)" = "${{ matrix.goos }}"
                  test "$(go env GOARCH)" = "${{ matrix.goarch }}"

            - name: Test server
              working-directory: server
              env:
                  GOWORK: "off"
                  CGO_ENABLED: "0"
              run: go test -mod=readonly ./...

            - name: Build release binary (macOS and Linux)
              if: runner.os != 'Windows'
              run: |
                  asset="go-codelens-ls-v${{ needs.metadata.outputs.version }}-${{ matrix.target }}${{ matrix.suffix }}"
                  sh ./scripts/build-server.sh \
                    "${{ matrix.goos }}" \
                    "${{ matrix.goarch }}" \
                    "dist/$asset"
                  test -f "dist/$asset"

            - name: Build release binary (Windows)
              if: runner.os == 'Windows'
              shell: pwsh
              run: |
                  $asset = "go-codelens-ls-v${{ needs.metadata.outputs.version }}-${{ matrix.target }}${{ matrix.suffix }}"
                  $outputPath = "dist/$asset"
                  & ./scripts/build-server.ps1 `
                    -TargetOS "${{ matrix.goos }}" `
                    -TargetArch "${{ matrix.goarch }}" `
                    -OutputPath $outputPath
                  if (-not (Test-Path -LiteralPath $outputPath -PathType Leaf)) {
                    throw "release binary was not built at $outputPath"
                  }

            - uses: actions/upload-artifact@v4
              with:
                  name: server-${{ matrix.target }}
                  path: dist/go-codelens-ls-*
                  if-no-files-found: error
                  retention-days: 1

    publish:
        name: Publish GitHub Release
        needs: [metadata, build]
        runs-on: ubuntu-24.04
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v4

            - uses: actions/download-artifact@v4
              with:
                  pattern: server-*
                  path: dist
                  merge-multiple: true

            - name: Generate checksums
              shell: bash
              run: |
                  mapfile -t binaries < <(
                    find dist -maxdepth 1 -type f -name 'go-codelens-ls-*' -printf '%f\n' |
                      LC_ALL=C sort
                  )
                  test "${#binaries[@]}" -eq 6
                  cd dist
                  sha256sum "${binaries[@]}" > SHA256SUMS

            - name: Publish assets
              env:
                  GH_TOKEN: ${{ github.token }}
              shell: bash
              run: |
                  if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
                    gh release upload "$GITHUB_REF_NAME" dist/* --clobber
                  else
                    gh release create "$GITHUB_REF_NAME" dist/* \
                      --verify-tag \
                      --title "Go CodeLens $GITHUB_REF_NAME" \
                      --generate-notes
                  fi
